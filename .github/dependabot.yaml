---
version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      docker:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      typescript:
        patterns:
          - "typescript"
      oxlint:
        patterns:
          - "oxlint"
      vite:
        patterns:
          - "vite"
          - "vite-*"
